name: Bug report
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Cloud (millionsend.com)
        - Self-hosted
        - Not applicable
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Self-hosted image tag / SDK version, if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste logs, API responses, or error messages. Redact API keys.
      render: shell
